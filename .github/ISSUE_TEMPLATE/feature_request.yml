name: 功能建议
description: 新功能、体验优化、界面与兼容性建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议。请说明使用场景，而不仅是「希望加一个按钮」，这样更容易评估。
  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      options:
        - 版本管理 / 启动游戏
        - 下载中心 / 模组市场
        - 备份 / 诊断
        - 设置 / 主题 / 美化包
        - 日志与悬浮球
        - 跨平台
        - 其它
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前遇到的麻烦或不便
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望启动器怎么表现；有参考截图或其它软件的做法也可以贴上来
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其它做法，或暂时的手动绕过方式
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，确认这不是重复建议
          required: true
