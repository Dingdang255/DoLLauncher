name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
    # 只改市场数据 / 文档时不重新构建（tag 推送不受 path 过滤影响）
    paths-ignore:
      - "market/**"
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # secrets 不能直接在 if 里使用，先转成普通环境变量
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本号由 git describe 生成，需要完整 tag 历史
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore signing keystore
        if: env.HAS_KEYSTORE == 'true'
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force keys | Out-Null
          [IO.File]::WriteAllBytes("keys/release.keystore", [Convert]::FromBase64String($env:KEYSTORE_BASE64))

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          DOL_KEYSTORE: keys/release.keystore
          DOL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DOL_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DOL_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: dotnet build src/DoLLauncher.Maui/DoLLauncher.Maui.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk

      # 仓库还没配置签名 Secrets 时退回调试签名，保证 CI 仍然可出包
      - name: Build debug APK (no signing secrets)
        if: env.HAS_KEYSTORE != 'true'
        run: dotnet build src/DoLLauncher.Maui/DoLLauncher.Maui.csproj -c Debug -f net10.0-android

      - uses: actions/upload-artifact@v4
        with:
          name: DoLLauncher-android
          path: |
            src/DoLLauncher.Maui/bin/Release/net10.0-android/com.dol.launcher-Signed.apk
            src/DoLLauncher.Maui/bin/Debug/net10.0-android/com.dol.launcher-Signed.apk
          if-no-files-found: error

      - name: Stage release APK
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Recurse -Filter com.dol.launcher-Signed.apk src/DoLLauncher.Maui/bin | Select-Object -First 1
          if (-not $apk) { throw "没有找到 APK" }
          Copy-Item $apk.FullName DoL-Launcher-android.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DoL-Launcher-android.apk
