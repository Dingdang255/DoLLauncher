name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve build info
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'dev' }
          $sha = '${{ github.sha }}'.Substring(0, 7)
          $time = (Get-Date).ToString('yyyy-MM-dd HH:mm')
          "BUILD_INFO=$tag|$sha|$time" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish single-file exe
        shell: pwsh
        run: |
          dotnet publish src/DoLLauncher/DoLLauncher.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:InformationalVersion="$env:BUILD_INFO" `
            -o _publish

      - name: Pack artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item _publish/DoLLauncher.exe stage/
          Copy-Item README.md, LICENSE stage/
          Copy-Item tools/scripts/DoL.bat, tools/scripts/launcher.ps1 stage/
          Compress-Archive -Path stage/DoLLauncher.exe, stage/README.md, stage/LICENSE, stage/DoL.bat, stage/launcher.ps1 -DestinationPath DoL-Launcher-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DoLLauncher-win-x64
          path: DoL-Launcher-win-x64.zip
          if-no-files-found: error

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $body = ''
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = ($lines | Select-String -SimpleMatch "## $tag").LineNumber
            if ($start) {
              $rest = @($lines[$start..($lines.Count - 1)])
              $next = $rest | Select-String '^## v' | Select-Object -First 1
              $body = if ($next) { ($rest[0..($next.LineNumber - 2)] -join "`n") } else { ($rest -join "`n") }
            }
          }
          if (-not $body.Trim()) { $body = "该版本未编写更新日志，详见提交历史。" }
          $body | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DoL-Launcher-win-x64.zip
          body_path: release-notes.md
