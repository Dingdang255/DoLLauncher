name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish single-file exe
        shell: pwsh
        run: |
          dotnet publish src/DoLLauncher/DoLLauncher.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o _publish

      - name: Pack artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item _publish/DoLLauncher.exe stage/
          Copy-Item README.md, LICENSE stage/
          Copy-Item tools/scripts/DoL.bat, tools/scripts/launcher.ps1 stage/
          Compress-Archive -Path stage/DoLLauncher.exe, stage/README.md, stage/LICENSE, stage/DoL.bat, stage/launcher.ps1 -DestinationPath DoL-Launcher-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DoLLauncher-win-x64
          path: DoL-Launcher-win-x64.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DoL-Launcher-win-x64.zip
          generate_release_notes: true
